name: docs

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    uses: ./.github/workflows/ci-check.yml
    permissions:
      contents: read
  export:
    needs: validate-docs
    uses: ./.github/workflows/automation-docs-export.yml
    permissions:
      contents: read
