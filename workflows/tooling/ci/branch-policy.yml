name: branch-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions: {}

jobs:
  policy:
    uses: ./.github/workflows/ci-branch-policy.yml
    permissions: {}
    with:
      # tooling has no staging branch (org-0010): every pull request targets main.
      flow: main
