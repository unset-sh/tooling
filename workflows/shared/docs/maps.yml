name: maps-refresh

on:
  workflow_call:
    inputs:
      registry:
        description: Repository-relative path to the map registry
        type: string
        default: .github/maps.json
      install:
        description: Install the consumer's locked dependencies without lifecycle scripts
        type: boolean
        default: true
    outputs:
      artifact-name:
        description: Complete validated JSON snapshot for this workflow run and attempt
        value: ${{ jobs.refresh.outputs.artifact-name }}

permissions: {}

jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      artifact-name: maps-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: This workflow knows where its own scripts are
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ "$WORKFLOW_REPOSITORY" != unset-sh/tooling ] || ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected to run from unset-sh/tooling at a full commit."
            exit 1
          fi

      - name: Check out the map source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false

      - name: Check out this workflow's own scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: source/.build/tooling
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: source/.build/tooling/.bun-version
          no-cache: true # never restore a runner from a cache another run wrote
          token: "" # an exact version needs no API call, so the action gets no token
      - name: Bun is the exact version source/.build/tooling/.bun-version names
        env:
          BUN_VERSION_FILE: source/.build/tooling/.bun-version
        # setup-bun falls back to the latest release when the file is missing or unreadable; this refuses that.
        run: test "$(bun --version)" = "$(cat "$BUN_VERSION_FILE")"

      - name: Install the map generators' dependencies
        if: inputs.install
        working-directory: source
        # --frozen-lockfile installs from package.json alone when there is no lockfile at all (Bun 1.4.4
        # docs/pm/cli/install.mdx), where npm's clean install refused, so a missing bun.lock stops the job here.
        run: |
          test -f bun.lock || { echo "::error::Dependencies are to be installed, but there is no bun.lock."; exit 1; }
          bun install --frozen-lockfile --ignore-scripts

      - name: Refresh and validate every registered map
        env:
          MAP_REGISTRY: ${{ inputs.registry }}
          DOCS_GITHUB_TOKEN: ${{ github.token }}
        run: bun source/.build/tooling/scripts/refresh-maps.mjs --root "$GITHUB_WORKSPACE/source" --registry "$MAP_REGISTRY" --out "$RUNNER_TEMP/maps-output"

      - name: Upload the complete map snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maps-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/maps-output
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: false
