name: branch-policy

on:
  workflow_call:

permissions: {}

jobs:
  policy:
    name: Validate branch policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.12.0
          package-manager-cache: false
      - name: Validate the pull request event
        # Read GitHub's event as data. No checkout, repository code, token or API call is needed.
        # This checks branch origin, not whether a human is using the GitHub account.
        shell: node {0}
        run: |
          const { readFileSync } = require('node:fs');
          try {
            if (process.env.GITHUB_EVENT_NAME !== 'pull_request') {
              throw new Error('Branch policy requires a pull_request event.');
            }
            let event;
            try { event = JSON.parse(readFileSync(process.env.GITHUB_EVENT_PATH, 'utf8')); }
            catch { throw new Error('Cannot read valid pull request event JSON.'); }
            const repository = process.env.GITHUB_REPOSITORY;
            const pr = event?.pull_request;
            const text = value => typeof value === 'string' && value.length > 0;
            if (!text(repository) || event?.repository?.full_name !== repository ||
                !text(pr?.base?.ref) || !text(pr?.head?.ref) ||
                pr?.base?.repo?.full_name !== repository || !text(pr?.head?.repo?.full_name)) {
              throw new Error('Missing or inconsistent pull request metadata.');
            }
            if (pr.base.ref !== 'staging' && pr.base.ref !== 'main') {
              throw new Error('Pull requests must target staging or main.');
            }
            if (pr.base.ref === 'main' &&
                (pr.head.ref !== 'staging' || pr.head.repo.full_name !== repository)) {
              throw new Error('Only same-repository staging may promote to main.');
            }
            console.log('Branch policy passed.');
          } catch (error) {
            console.error(`::error::${error.message}`);
            process.exitCode = 1;
          }
