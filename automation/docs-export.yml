name: docs-export

on:
  workflow_call:

permissions: {}

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: This workflow knows where its own scripts are
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        # Empty values would let checkout fall back to the consumer and substitute its helper code.
        run: |
          if [ "$WORKFLOW_REPOSITORY" != unset-sh/tooling ] || ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected to run from unset-sh/tooling at a full commit, got '$WORKFLOW_REPOSITORY' at '$WORKFLOW_SHA'."
            exit 1
          fi
      - name: Check out the documentation source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Check out this workflow's own scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tooling/.nvmrc
          package-manager-cache: false
      - name: Export committed public documentation
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REVISION: ${{ github.sha }}
        run: node tooling/scripts/export-docs.mjs --root "$GITHUB_WORKSPACE/source" --repository "$SOURCE_REPOSITORY" --revision "$SOURCE_REVISION" --out "$RUNNER_TEMP/docs-export"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-${{ github.sha }}
          path: ${{ runner.temp }}/docs-export
          if-no-files-found: error
          retention-days: 14
