# Generated by scripts/workflows.mjs from workflows/shared/ci/check.yml to .github/workflows/ci-check.yml; do not edit.
name: check

# The check every unset.sh repository runs on a pull request and on main, called from that repository:
#
#   jobs:
#     check:
#       uses: unset-sh/tooling/.github/workflows/ci-check.yml@<full commit> # v<version>
#       permissions:
#         contents: read
#
# It checks out the calling repository, installs the Bun version its .bun-version names, and runs its check
# command. The job holds a read-only token and no secret, so it is safe on a pull request from a fork.
# docs/use-workflows.md describes the inputs.

on:
  workflow_call:
    inputs:
      install:
        description: Run `bun install --frozen-lockfile --ignore-scripts` from the committed bun.lock before the check. Leave off for a repository with no dependencies.
        type: boolean
        default: false
      command:
        description: The command that must pass.
        type: string
        default: bun run check
      keep:
        description: A path to keep as the artifact `check-output` for 14 days, even when the check fails. Empty keeps nothing.
        type: string
        default: ""
      timeout-minutes:
        description: How long the job may run.
        type: number
        default: 10
      postgres-image:
        description: A Postgres image pinned by digest (`postgres:<tag>@sha256:<64 hex>`) to run beside the check, with no password and reachable only from the job, at the address the PG* variables name. Empty runs none.
        type: string
        default: ""
      openfga-image:
        description: An OpenFGA image pinned by digest (`openfga/openfga:v<version>@sha256:<64 hex>`) to run beside the check, in memory and reachable only from the job, at the address FGA_URL names with the throwaway key FGA_KEY. Empty runs none.
        type: string
        default: ""
      valkey-image:
        description: A Valkey image pinned by digest (`valkey/valkey:<tag>@sha256:<64 hex>`) to run beside the check, in memory and reachable only from the job, at the address VALKEY_URL names with the throwaway password VALKEY_PASSWORD. Empty runs none.
        type: string
        default: ""
      garage-image:
        description: A Garage image pinned by digest (`dxflrs/garage:v<version>@sha256:<64 hex>`) to run beside the check as a single node, in memory and reachable only from the job, with one bucket and one access key made for the run, at the S3 endpoint S3_ENDPOINT names. Empty runs none.
        type: string
        default: ""

permissions: {}

defaults:
  run:
    shell: bash # with -o pipefail, so a failed command before a pipe fails the step

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
      packages: read # install @unset-sh packages; only the install step gets the token
    services:
      # GitHub starts no service whose image is an empty string (docs.github.com, workflow syntax,
      # jobs.<job_id>.services.<service_id>.image), so a caller without postgres-image gets none.
      postgres:
        image: ${{ inputs.postgres-image }}
        env:
          # A throwaway database on an ephemeral runner, published on the runner's loopback only: no password
          # exists to leak, and the check's own tests create any role they need.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    steps:
      - name: The Postgres image is pinned by digest
        if: inputs.postgres-image != ''
        env:
          POSTGRES_IMAGE: ${{ inputs.postgres-image }}
        # The service has already started by now, so a tag that moved would have run; refusing here still fails
        # the check, so a caller cannot pass with an image nobody reviewed.
        run: |
          [[ "$POSTGRES_IMAGE" =~ ^(docker\.io/(library/)?)?postgres:[0-9][0-9A-Za-z.-]*@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::postgres-image must be postgres:<tag>@sha256:<64 hex>."
            exit 1
          }
          {
            echo "PGHOST=127.0.0.1"
            echo "PGPORT=5432"
            echo "PGUSER=postgres"
            echo "PGDATABASE=postgres"
          } >> "$GITHUB_ENV"
      - name: Start OpenFGA from an image pinned by digest
        if: inputs.openfga-image != ''
        env:
          OPENFGA_IMAGE: ${{ inputs.openfga-image }}
        # A service cannot take a command, and OpenFGA's image needs `run`, so the job starts it itself. It keeps
        # its data in memory and listens on the runner's loopback only. The preshared key is made for this run,
        # masked, and dies with the runner; it guards nothing but this throwaway server.
        run: |
          [[ "$OPENFGA_IMAGE" =~ ^(docker\.io/)?openfga/openfga:v[0-9][0-9A-Za-z.-]*@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::openfga-image must be openfga/openfga:v<version>@sha256:<64 hex>."
            exit 1
          }
          key="$(openssl rand -hex 32)"
          echo "::add-mask::$key"
          docker run --detach --name openfga --publish 127.0.0.1:8080:8080 \
            --env OPENFGA_DATASTORE_ENGINE=memory --env OPENFGA_AUTHN_METHOD=preshared \
            --env OPENFGA_AUTHN_PRESHARED_KEYS="$key" --env OPENFGA_PLAYGROUND_ENABLED=false \
            "$OPENFGA_IMAGE" run > /dev/null
          for _ in $(seq 60); do
            curl --silent --fail http://127.0.0.1:8080/healthz > /dev/null && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:8080/healthz > /dev/null || {
            echo "::error::OpenFGA did not become healthy within 60 seconds."
            exit 1
          }
          {
            echo "FGA_URL=http://127.0.0.1:8080"
            echo "FGA_KEY=$key"
          } >> "$GITHUB_ENV"
      - name: Start Valkey from an image pinned by digest
        if: inputs.valkey-image != ''
        env:
          VALKEY_IMAGE: ${{ inputs.valkey-image }}
        # Started by the job, like OpenFGA, so the image is refused before anything runs and the server gets a
        # password: Valkey's protected mode would refuse a passwordless client that reaches it through Docker's port
        # mapping. It keeps its data in memory only (no snapshot, no append-only file) and listens on the runner's
        # loopback. The password is made for this run, masked, and dies with the runner.
        run: |
          [[ "$VALKEY_IMAGE" =~ ^(docker\.io/)?valkey/valkey:[0-9][0-9A-Za-z.-]*@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::valkey-image must be valkey/valkey:<tag>@sha256:<64 hex>."
            exit 1
          }
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"
          docker run --detach --name valkey --publish 127.0.0.1:6379:6379 \
            "$VALKEY_IMAGE" valkey-server --requirepass "$password" --save "" --appendonly no > /dev/null
          for _ in $(seq 60); do
            docker exec valkey valkey-cli --no-auth-warning -a "$password" ping 2> /dev/null | grep -q PONG && break
            sleep 1
          done
          docker exec valkey valkey-cli --no-auth-warning -a "$password" ping 2> /dev/null | grep -q PONG || {
            echo "::error::Valkey did not answer within 60 seconds."
            exit 1
          }
          {
            echo "VALKEY_URL=redis://127.0.0.1:6379"
            echo "VALKEY_PASSWORD=$password"
          } >> "$GITHUB_ENV"
      - name: Start Garage from an image pinned by digest
        if: inputs.garage-image != ''
        env:
          GARAGE_IMAGE: ${{ inputs.garage-image }}
        # Garage's own single-node start (Garage v2.5.0 `garage server --help`: --single-node lays out one node and
        # --default-bucket creates the bucket and key that GARAGE_DEFAULT_* name). It runs as nobody, read-only, with
        # no capabilities and its data in memory, and publishes only the S3 port on the runner's loopback. The RPC
        # secret and the access key are made for this run, masked, and die with the runner.
        run: |
          [[ "$GARAGE_IMAGE" =~ ^(docker\.io/)?dxflrs/garage:v[0-9][0-9A-Za-z.-]*@sha256:[0-9a-f]{64}$ ]] || {
            echo "::error::garage-image must be dxflrs/garage:v<version>@sha256:<64 hex>."
            exit 1
          }
          rpc_secret="$(openssl rand -hex 32)"
          key_id="GK$(openssl rand -hex 12)"
          secret_key="$(openssl rand -hex 32)"
          echo "::add-mask::$rpc_secret"
          echo "::add-mask::$secret_key"
          config="$RUNNER_TEMP/garage.toml"
          printf '%s\n' 'metadata_dir = "/var/lib/garage/meta"' 'data_dir = "/var/lib/garage/data"' \
            'db_engine = "sqlite"' 'replication_factor = 1' 'rpc_bind_addr = "0.0.0.0:3901"' \
            'rpc_public_addr = "127.0.0.1:3901"' '[s3_api]' 's3_region = "garage"' \
            'api_bind_addr = "0.0.0.0:3900"' > "$config"
          docker run --detach --name garage --user 65534:65534 --read-only --cap-drop ALL \
            --security-opt no-new-privileges --tmpfs /var/lib/garage:uid=65534,gid=65534 \
            --publish 127.0.0.1:3900:3900 --volume "$config:/etc/garage.toml:ro" \
            --env GARAGE_RPC_SECRET="$rpc_secret" --env GARAGE_DEFAULT_ACCESS_KEY="$key_id" \
            --env GARAGE_DEFAULT_SECRET_KEY="$secret_key" --env GARAGE_DEFAULT_BUCKET=check \
            "$GARAGE_IMAGE" /garage server --single-node --default-bucket > /dev/null
          for _ in $(seq 60); do
            docker exec garage /garage bucket info check > /dev/null 2>&1 && break
            sleep 1
          done
          docker exec garage /garage bucket info check > /dev/null 2>&1 || {
            echo "::error::Garage did not have its bucket within 60 seconds."
            exit 1
          }
          {
            echo "S3_ENDPOINT=http://127.0.0.1:3900"
            echo "S3_REGION=garage"
            echo "S3_BUCKET=check"
            echo "S3_ACCESS_KEY_ID=$key_id"
            echo "S3_SECRET_ACCESS_KEY=$secret_key"
          } >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
          no-cache: true # never restore a runner from a cache another run wrote
          token: "" # an exact version needs no API call, so the action gets no token
      - name: Bun is the exact version .bun-version names
        env:
          BUN_VERSION_FILE: .bun-version
        # setup-bun falls back to the latest release when the file is missing or unreadable; this refuses that.
        run: test "$(bun --version)" = "$(cat "$BUN_VERSION_FILE")"
      - name: Install dependencies, running none of their scripts
        if: inputs.install
        # --frozen-lockfile installs from package.json alone when there is no lockfile at all (Bun 1.4.4
        # docs/pm/cli/install.mdx), where npm's clean install refused, so a missing bun.lock stops the job here.
        # The token reads packages only, and only this step sees it: a repository's bunfig.toml names
        # $GITHUB_PACKAGES_TOKEN for the @unset-sh scope on GitHub Packages, which needs a token even to read.
        # It is never NPM_CONFIG_TOKEN: Bun sends that one to the default registry too (Bun 1.4.4
        # docs/pm/npmrc.mdx), which would hand this token to registry.npmjs.org. --ignore-scripts runs no
        # dependency code while it is present.
        env:
          GITHUB_PACKAGES_TOKEN: ${{ github.token }}
        run: |
          test -f bun.lock || { echo "::error::Dependencies are to be installed, but there is no bun.lock."; exit 1; }
          bun install --frozen-lockfile --ignore-scripts
      - name: Check
        env:
          COMMAND: ${{ inputs.command }}
        run: bash -eo pipefail -c "$COMMAND"
      - name: Keep the output to look at
        if: always() && inputs.keep != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-output
          path: ${{ inputs.keep }}
          if-no-files-found: warn
          retention-days: 14
