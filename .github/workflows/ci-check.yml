# Generated by scripts/workflows.mjs from ci/check.yml; do not edit.
name: check

# The check every unset.sh repository runs on a pull request and on main, called from that repository:
#
#   jobs:
#     check:
#       uses: unset-sh/tooling/.github/workflows/ci-check.yml@<full commit> # v<version>
#       permissions:
#         contents: read
#
# It checks out the calling repository, installs the Node version its .nvmrc names, and runs its check
# command. The job holds a read-only token and no secret, so it is safe on a pull request from a fork.
# docs/site/use-workflows.md describes the inputs.

on:
  workflow_call:
    inputs:
      install:
        description: Run `npm ci --ignore-scripts` before the check. Leave off for a repository with no dependencies.
        type: boolean
        default: false
      command:
        description: The command that must pass.
        type: string
        default: npm run check
      keep:
        description: A path to keep as the artifact `check-output` for 14 days, even when the check fails. Empty keeps nothing.
        type: string
        default: ""
      timeout-minutes:
        description: How long the job may run.
        type: number
        default: 10

permissions: {}

defaults:
  run:
    shell: bash # with -o pipefail, so a failed command before a pipe fails the step

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Install dependencies, running none of their scripts
        if: inputs.install
        run: npm ci --ignore-scripts
      - name: Check
        env:
          COMMAND: ${{ inputs.command }}
        run: bash -eo pipefail -c "$COMMAND"
      - name: Keep the output to look at
        if: always() && inputs.keep != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: check-output
          path: ${{ inputs.keep }}
          if-no-files-found: warn
          retention-days: 14
