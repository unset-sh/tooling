# Generated by scripts/workflows.mjs from workflows/shared/ci/pr-policy.yml to .github/workflows/ci-pr-policy.yml; do not edit.
name: pr-policy

on:
  workflow_call:

permissions: {}

jobs:
  check:
    name: PR policy
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Verify the event and central implementation identity
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ "$EVENT_NAME" != pull_request ] || [ "$WORKFLOW_REPOSITORY" != unset-sh/tooling ] || ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Expected a pull-request event and an exact central tooling implementation.'
            exit 1
          fi
      - name: Check out only the reviewed central checks
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: tooling/.bun-version
          no-cache: true # never restore a runner from a cache another run wrote
          token: "" # an exact version needs no API call, so the action gets no token
      - name: Bun is the exact version tooling/.bun-version names
        env:
          BUN_VERSION_FILE: tooling/.bun-version
        # setup-bun falls back to the latest release when the file is missing or unreadable; this refuses that.
        run: test "$(bun --version)" = "$(cat "$BUN_VERSION_FILE")"
      - name: Check current pull-request declarations
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tooling/scripts/pr-policy.mjs
