# Generated by scripts/workflows.mjs from workflows/docs/pages/schedule.yml to .github/workflows/automation-docs-map-schedule.yml; do not edit.
name: docs-map-schedule

on:
  workflow_call:

permissions: {}

jobs:
  dispatch:
    name: Request the main site refresh
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Verify the timer and central helper identities
        env:
          SOURCE_REPOSITORY: ${{ github.repository }}
          SOURCE_REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ "$SOURCE_REPOSITORY" != unset-sh/docs ] || [ "$SOURCE_REF" != refs/heads/main ] || [ "$WORKFLOW_REPOSITORY" != unset-sh/tooling ] || ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Expected the docs main timer and pinned tooling.'
            exit 1
          fi
          case "$EVENT" in schedule|workflow_dispatch) ;; *) exit 1 ;; esac
      - name: Check out only the reviewed central helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: tooling/.bun-version
          no-cache: true # never restore a runner from a cache another run wrote
          token: "" # an exact version needs no API call, so the action gets no token
      - name: Bun is the exact version tooling/.bun-version names
        env:
          BUN_VERSION_FILE: tooling/.bun-version
        # setup-bun falls back to the latest release when the file is missing or unreadable; this refuses that.
        run: test "$(bun --version)" = "$(cat "$BUN_VERSION_FILE")"
      - name: Request the existing main workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun tooling/scripts/docs-map-schedule.mjs
