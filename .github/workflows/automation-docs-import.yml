        run: |
          set -euo pipefail
          if [ "$WORKFLOW_REPOSITORY" != unset-sh/tooling ] || ! [[ "$WORKFLOW_SHA" =~ ^[a-f0-9]{40}$ ]] || [ "$GITHUB_REPOSITORY" != unset-sh/docs ] || [ "$GITHUB_REF" != refs/heads/staging ] || ! [[ "$GITHUB_SHA" =~ ^[a-f0-9]{40}$ ]] || ! [[ "$IMPORT_SOURCE" =~ ^(tooling|github)$ ]] || ! [[ "$GITHUB_EVENT_NAME" =~ ^(schedule|workflow_dispatch)$ ]]; then
