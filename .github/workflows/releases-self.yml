# Generated by scripts/workflows.mjs from releases/self.yml; do not edit.
name: self-release

# This repository's own release, through the release workflow it ships. The workflow files themselves are
# attached and attested, so a repository that is about to call the commit of a release can check that the
# commit went through the owner's approval, and not only that a tag names it (docs/site/release-reference.md,
# "Verify a workflow version").

on:
  push:
    branches: [main]
    paths: [package.json]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    uses: ./.github/workflows/releases-package.yml
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: read
    with:
      files: .github/workflows
