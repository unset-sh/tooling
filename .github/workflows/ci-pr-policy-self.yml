# Generated by scripts/workflows.mjs from workflows/tooling/ci/pr-policy.yml to .github/workflows/ci-pr-policy-self.yml; do not edit.
name: pr-policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled, ready_for_review]

permissions: {}

concurrency:
  group: pr-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  policy:
    uses: ./.github/workflows/ci-pr-policy.yml
    permissions:
      contents: read
      pull-requests: read
