# Generated by scripts/workflows.mjs from workflows/shared/releases/channel.yml to .github/workflows/releases-channel.yml; do not edit.
name: release channel

# Separate opt-in contract. Legacy releases-package.yml retains its owner approval.
# See docs/release-channels.md for required settings and the human promotion boundary.
# Only build executes consumer code. Publish checks exact Git data and untrusted artifacts,
# rechecks authority, atomically reserves the tag, and uses explicit registry/channel flags.
on:
  workflow_call:
    inputs:
      install:
        description: Run bun install --frozen-lockfile --ignore-scripts using the committed root bun.lock.
        type: boolean
        default: false
      check:
        description: Consumer check command, run with read-only permissions after version preparation.
        type: string
        default: bun run check
      build:
        description: Consumer build command, run after successful checks with read-only permissions.
        type: string
        default: ""
      files:
        description: Repository folder of plain files to attest and attach; empty means none.
        type: string
        default: ""
      npm-package:
        description: Pack and publish the root package to GitHub Packages with an explicit channel tag.
        type: boolean
        default: false
    outputs:
      version:
        description: Published channel version, or 0.0.0 when no release is requested.
        value: ${{ jobs.plan.outputs.version }}
      channel:
        description: staging or stable, derived only from the push branch.
        value: ${{ jobs.plan.outputs.channel }}
      released:
        description: "'true' after publication and exact tag verification."
        value: ${{ jobs.publish.outputs.released }}

permissions: {}
concurrency:
  group: channel-release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false
defaults:
  run:
    shell: bash

jobs:
  plan:
    name: Verify release source and channel authority
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
      pull-requests: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      publish: ${{ steps.plan.outputs.publish }}
      channel: ${{ steps.plan.outputs.channel }}
      environment: ${{ steps.plan.outputs.environment }}
    steps:
      - name: Require this workflow's exact helper identity
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ "$WORKFLOW_REPOSITORY" != unset-sh/tooling ] || ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Expected unset-sh/tooling at a full commit.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflows
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: workflows/.bun-version
          no-cache: true # never restore a runner from a cache another run wrote
          token: "" # an exact version needs no API call, so the action gets no token
      - name: Bun is the exact version workflows/.bun-version names
        env:
          BUN_VERSION_FILE: workflows/.bun-version
        # setup-bun falls back to the latest release when the file is missing or unreadable; this refuses that.
        run: test "$(bun --version)" = "$(cat "$BUN_VERSION_FILE")"
      - name: Read immutable source and pre-existing protections
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_PACKAGE: ${{ inputs.npm-package }}
          INSTALL: ${{ inputs.install }}
        run: bun workflows/scripts/release-channel-run.mjs plan

  build:
    name: Check and build the channel version
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read # install @unset-sh packages; only the install step gets the token
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      NPM_PACKAGE: ${{ inputs.npm-package }}
      INSTALL: ${{ inputs.install }}
    steps:
      - name: Require this workflow's exact helper identity
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ "$WORKFLOW_REPOSITORY" != unset-sh/tooling ] || ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Expected unset-sh/tooling at a full commit.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: repository
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflows
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: workflows/.bun-version
          no-cache: true # never restore a runner from a cache another run wrote
          token: "" # an exact version needs no API call, so the action gets no token
      - name: Bun is the exact version workflows/.bun-version names
        env:
          BUN_VERSION_FILE: workflows/.bun-version
        # setup-bun falls back to the latest release when the file is missing or unreadable; this refuses that.
        run: test "$(bun --version)" = "$(cat "$BUN_VERSION_FILE")"
      - name: Prepare only the root package and lock versions
        env:
          SOURCE_DIRECTORY: ${{ github.workspace }}/repository
        run: bun workflows/scripts/release-channel-run.mjs prepare
      - name: Install without lifecycle scripts
        if: inputs.install
        working-directory: repository
        # --frozen-lockfile installs from package.json alone when there is no lockfile at all (Bun 1.4.4
        # docs/pm/cli/install.mdx), where npm's clean install refused, so a missing bun.lock stops the job here.
        # The token reads packages only, and only this step sees it: a repository's bunfig.toml names it for the
        # @unset-sh scope on GitHub Packages, which needs a token even to read. --ignore-scripts runs no
        # dependency code while it is present.
        env:
          NPM_CONFIG_TOKEN: ${{ github.token }}
        run: |
          test -f bun.lock || { echo "::error::Dependencies are to be installed, but there is no bun.lock."; exit 1; }
          bun install --frozen-lockfile --ignore-scripts
      - name: Check
        working-directory: repository
        env:
          COMMAND: ${{ inputs.check }}
        run: bash -eo pipefail -c "$COMMAND"
      - name: Build
        if: inputs.build != ''
        working-directory: repository
        env:
          COMMAND: ${{ inputs.build }}
        run: bash -eo pipefail -c "$COMMAND"
      - name: Pack without lifecycle scripts
        if: inputs.npm-package
        working-directory: repository
        run: |
          mkdir -p "$RUNNER_TEMP/channel/files"
          bun pm pack --ignore-scripts --quiet --destination "$RUNNER_TEMP/channel/files" > /dev/null
      - name: Gather plain release files
        if: inputs.files != ''
        env:
          FILES: ${{ inputs.files }}
        run: bun workflows/scripts/release-files.mjs collect repository "$FILES" "$RUNNER_TEMP/channel/files"
      - name: Bind the artifact to this exact source and run
        env:
          ARTIFACT_DIRECTORY: ${{ runner.temp }}/channel
        run: bun workflows/scripts/release-channel-run.mjs receipt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: channel-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/channel/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the verified channel release
    needs: [plan, build]
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ needs.plan.outputs.environment }}
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
      actions: read
      pull-requests: read
    outputs:
      released: ${{ steps.published.outputs.released }}
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      CHANNEL: ${{ needs.plan.outputs.channel }}
      NPM_PACKAGE: ${{ inputs.npm-package }}
      INSTALL: ${{ inputs.install }}
    steps:
      - name: Require this workflow's exact helper identity
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ "$WORKFLOW_REPOSITORY" != unset-sh/tooling ] || ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo '::error::Expected unset-sh/tooling at a full commit.'
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflows
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: workflows/.bun-version
          no-cache: true # never restore a runner from a cache another run wrote
          token: "" # an exact version needs no API call, so the action gets no token
      - name: Bun is the exact version workflows/.bun-version names
        env:
          BUN_VERSION_FILE: workflows/.bun-version
        # setup-bun falls back to the latest release when the file is missing or unreadable; this refuses that.
        run: test "$(bun --version)" = "$(cat "$BUN_VERSION_FILE")"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: channel-${{ github.run_id }}-${{ github.run_attempt }}
          path: release
      - name: Recheck authority and validate every artifact against committed source
        id: verified
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACT_DIRECTORY: ${{ github.workspace }}/release
        run: bun workflows/scripts/release-channel-run.mjs verify
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: steps.verified.outputs.count != '0'
        with:
          subject-path: release/files/*
      - name: Recheck protections and reserve a new tag at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun workflows/scripts/release-channel-run.mjs reserve
      - name: Publish the package with an explicit registry and channel
        if: inputs.npm-package
        env:
          NPM_CONFIG_TOKEN: ${{ github.token }}
          DIST_TAG: ${{ steps.verified.outputs.dist_tag }}
        # As in releases-package.yml: a new folder holding only the verified package and a package.json of
        # `{}`, HOME set to it, and three environment names, so no settings file can redirect the token.
        run: |
          package="$(cat "$RUNNER_TEMP/channel-package.txt")"
          folder="$(mktemp -d)"
          cp "release/files/$package" "$folder/"
          printf '{}\n' > "$folder/package.json"
          cd "$folder"
          env -i PATH="$PATH" HOME="$folder" NPM_CONFIG_TOKEN="$NPM_CONFIG_TOKEN" \
            bun publish --ignore-scripts --tag "$DIST_TAG" --registry https://npm.pkg.github.com "./$package"
      - name: Publish the release page using only the reserved tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=()
          while IFS= read -r name; do assets+=("release/files/$name"); done < "$RUNNER_TEMP/channel-names.txt"
          flags=(--latest)
          if [ "$CHANNEL" = staging ]; then flags=(--prerelease --latest=false); fi
          gh release create "v$VERSION" "${assets[@]}" --verify-tag "${flags[@]}" \
            --title "v$VERSION" --notes-file "$RUNNER_TEMP/channel-notes.md"
      - name: Confirm exact published tag identity
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          bun workflows/scripts/release-channel-run.mjs confirm
          {
            echo "Published $CHANNEL v$VERSION at $GITHUB_SHA."
            echo "https://github.com/$GH_REPO/releases/tag/v$VERSION"
            echo 'Verify downloaded artifacts with:'
            echo '```sh'
            echo "gh attestation verify <file> --repo $GH_REPO --signer-workflow unset-sh/tooling/.github/workflows/releases-channel.yml --source-ref $GITHUB_REF"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
