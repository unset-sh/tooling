# Generated by scripts/workflows.mjs from workflows/shared/image/staging.yml to .github/workflows/image-staging.yml; do not edit.
name: staging image

# Builds a repository's container image when a change merges into its staging branch, pushes it by digest to
# ghcr.io/unset-sh/staging/<image-name>, and attests its build provenance. Called from that repository:
#
#   on:
#     push:
#       branches: [staging]
#   permissions: {}
#   jobs:
#     image:
#       uses: unset-sh/tooling/.github/workflows/image-staging.yml@<full commit> # <version or note>
#       permissions:
#         contents: read
#         packages: write
#         id-token: write
#         attestations: write
#       # with:
#       #   read-packages: true # only for a Dockerfile that installs @unset-sh packages
#
# Alex decided on 2026-11-23: one shared workflow; it runs on a push to staging and never on a pull request;
# images go to ghcr.io/unset-sh/staging/<repository>, the path saying the channel; consumers use the digest,
# so the image gets no tag, and never a production path; the run's own GITHUB_TOKEN is the only credential.
# org-0020 adds an optional validated app image-name for monorepos; omitted, it remains the repository name.
# The attestation pushed beside the image does sit under the OCI referrers tag sha256-<image hex>, which
# actions/attest writes because GHCR has no referrers API. docs/build-staging-images.md describes the inputs,
# the package settings and the verify command.
#
# What runs where (the split releases-package.yml uses):
#   - `build` runs the calling repository's code: a Dockerfile's RUN steps are that repository's commands. It
#     holds a read-only token (contents, and packages for a caller that sets read-packages), builds to an OCI image layout on disk and pushes nothing.
#   - `publish` is the only job that can write and runs no code of the calling repository: only this
#     repository's script, pinned actions, Bun, crane and docker login. It checks what `build` handed over as
#     untrusted data before pushing it.
#   - The scripts come from this repository at the commit this workflow file runs from
#     (`job.workflow_repository` and `job.workflow_sha`,
#     https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context, read 2026-11-22).
#
# Why the attestation proves the source: it is signed for this file (a job in a reusable workflow is signed
# for the called file, not the caller,
# https://docs.github.com/en/actions/how-tos/secure-your-work/use-artifact-attestations/increase-security-rating,
# read 2026-11-22), and its certificate records the caller's repository, ref and commit and this file's commit
# as Source Repository Ref, Source Repository Digest and Build Signer Digest
# (https://github.com/sigstore/fulcio/blob/main/docs/oid-info.md, read 2026-11-24). Artifact attestations on
# the Free, Pro and Team plans exist for public repositories only
# (github/docs data/reusables/gated-features/attestations.md, read 2026-11-24).

on:
  workflow_call:
    inputs:
      image-name:
        description: Optional app image name (lower-case letters, digits and single dashes). Empty uses the calling repository name.
        type: string
        default: ""
      context:
        description: The build context, a folder of the repository.
        type: string
        default: .
      dockerfile:
        description: The Dockerfile, a path from the repository root. Every image it pulls must be pinned by digest.
        type: string
        default: Dockerfile
      platform:
        description: The one platform to build, `linux/amd64` or `linux/arm64`, each on a runner of that architecture.
        type: string
        default: linux/amd64
      read-packages:
        description: >-
          Hand the run's own token, which can read packages, to the build as the BuildKit secret
          `github_packages_token`, for a Dockerfile that installs @unset-sh packages from GitHub Packages. Off by default.
        type: boolean
        default: false
      timeout-minutes:
        description: How long the build job may run.
        type: number
        default: 30
    outputs:
      digest:
        description: The pushed image's digest, sha256:<64 hex>.
        value: ${{ jobs.publish.outputs.digest }}
      image:
        description: The full image reference with the digest, ghcr.io/unset-sh/staging/<image-name>@sha256:<64 hex>.
        value: ${{ jobs.publish.outputs.image }}

permissions: {}

defaults:
  run:
    shell: bash # with -o pipefail, so a failed command before a pipe fails the step

jobs:
  build:
    name: Build the image
    # One native runner per platform, so no emulator runs the build. An unknown platform fails the first step.
    runs-on: ${{ inputs.platform == 'linux/arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    # packages: read is held by every build's token, because a job's permissions cannot depend on an input, but the
    # token reaches the repository's code only when the caller sets read-packages (Alex, 2026-11-24: an opt-in read
    # token, handed only to repositories that ask, never in the image). Nothing else here passes it on.
    permissions:
      contents: read
      packages: read
    outputs:
      digest: ${{ steps.layout.outputs.digest }}
    steps:
      - name: An image is built only from a push to staging in the organisation
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image-name }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          if [ "$EVENT" != push ] || [ "$REF" != refs/heads/staging ]; then
            echo "::error::A staging image is built only from a push to staging. This run is $EVENT on $REF."
            exit 1
          fi
          if [ "$OWNER" != unset-sh ] || ! [[ "$REPOSITORY" =~ ^unset-sh/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Expected a repository of unset-sh named in lower-case letters, digits and dashes, got '$REPOSITORY'."
            exit 1
          fi
          if [ -n "$IMAGE_NAME" ] && ! [[ "$IMAGE_NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Expected image-name to contain lower-case letters, digits and single dashes, with no leading or trailing dash."
            exit 1
          fi
          if [ "$PLATFORM" != linux/amd64 ] && [ "$PLATFORM" != linux/arm64 ]; then
            echo "::error::The platform is linux/amd64 or linux/arm64, not '$PLATFORM'."
            exit 1
          fi
      - name: This workflow knows where its own scripts are
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        # If these were empty, the checkout below would fall back to the calling repository and the steps
        # after it would run that repository's files in place of the scripts here.
        run: |
          if [ "$WORKFLOW_REPOSITORY" != unset-sh/tooling ] || ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected to run from unset-sh/tooling at a full commit, got '$WORKFLOW_REPOSITORY' at '$WORKFLOW_SHA'."
            exit 1
          fi
      - name: Check out the repository at the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: repository
          persist-credentials: false
      - name: Check out this workflow's own scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflows
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: workflows/.bun-version
          no-cache: true # never restore a runner from a cache another run wrote
          token: "" # an exact version needs no API call, so the action gets no token
      - name: Bun is the exact version workflows/.bun-version names
        env:
          BUN_VERSION_FILE: workflows/.bun-version
        # setup-bun falls back to the latest release when the file is missing or unreadable; this refuses that.
        run: test "$(bun --version)" = "$(cat "$BUN_VERSION_FILE")"
      - name: The Dockerfile pulls only images pinned by digest
        env:
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
        # Before anything of the repository runs. A moving tag would let the same commit build different images.
        run: |
          images="$(bun workflows/scripts/image-staging.mjs dockerfile repository "$CONTEXT" "$DOCKERFILE")"
          {
            echo "## Images the Dockerfile pulls"
            echo
            echo '```'
            echo "${images:-none: every stage starts from scratch}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Read the licence and the commit time for the image
        id: labels
        run: |
          license="$(bun workflows/scripts/image-staging.mjs license repository/package.json)"
          epoch="$(git -C repository log -1 --format=%ct HEAD)"
          [[ "$epoch" =~ ^[0-9]+$ ]] || { echo "::error::The commit time '$epoch' is not a number."; exit 1; }
          echo "license=$license" >> "$GITHUB_OUTPUT"
          echo "epoch=$epoch" >> "$GITHUB_OUTPUT"
      - name: Build the image to an OCI layout, pushing nothing
        env:
          # BuildKit v0.35.0 (released 2026-11-11), pinned by digest, in a builder this run creates: no cache
          # from another run exists in it. The docker driver cannot write an OCI layout
          # (docker/docs content/manuals/build/exporters/oci-docker.md, read 2026-11-24).
          BUILDKIT_IMAGE: moby/buildkit:v0.35.0@sha256:aa632b921ef07411d2cb77292cd34213d4f7b384001d6fceef1e1f25bf9752bb
          CONTEXT: ${{ inputs.context }}
          DOCKERFILE: ${{ inputs.dockerfile }}
          PLATFORM: ${{ inputs.platform }}
          LICENSE: ${{ steps.labels.outputs.license }}
          # Buildx passes SOURCE_DATE_EPOCH on as the build argument of that name, which sets the created times;
          # rewrite-timestamp=true sets the files' times in the layers to it too
          # (moby/buildkit docs/build-repro.md, read 2026-11-24).
          SOURCE_DATE_EPOCH: ${{ steps.labels.outputs.epoch }}
          # Empty unless the caller set read-packages. BuildKit mounts a secret only in a RUN that asks for it, and
          # never writes it into a layer, the build's cache or the image's settings
          # (https://docs.docker.com/build/building/secrets/, read 2026-11-24).
          PACKAGES_TOKEN: ${{ inputs.read-packages && github.token || '' }}
        # No provenance or SBOM from BuildKit, so the layout holds one image manifest and not an index; the
        # provenance that counts is the attestation `publish` signs. tar=false writes the layout as a folder, so
        # `publish` reads plain files and unpacks no archive. Only the labels below and, when asked for, the
        # package token are passed in; the repository passes no build argument or secret of its own.
        run: |
          secret=()
          if [ -n "$PACKAGES_TOKEN" ]; then secret=(--secret id=github_packages_token,env=PACKAGES_TOKEN); fi
          docker buildx version
          builder="staging-image-$GITHUB_RUN_ID"
          docker buildx create --name "$builder" --driver docker-container --driver-opt "image=$BUILDKIT_IMAGE" --bootstrap
          out="$RUNNER_TEMP/image"
          docker buildx build \
            --builder "$builder" \
            --platform "$PLATFORM" \
            --file "repository/$DOCKERFILE" \
            --no-cache \
            --provenance=false \
            --sbom=false \
            --progress=plain \
            "${secret[@]}" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=$LICENSE" \
            --output "type=oci,dest=$out,tar=false,rewrite-timestamp=true" \
            "repository/$CONTEXT"
          # BuildKit leaves an empty ingest folder beside the layout; anything in it fails here.
          if [ -d "$out/ingest" ]; then rmdir "$out/ingest"; fi
      - name: The layout holds one image for the platform, labelled with this commit
        id: layout
        env:
          PLATFORM: ${{ inputs.platform }}
        # `publish` makes the same check on what it downloads, and that one counts: this job ran the
        # repository's code. It is made here too so a refusal names the build, and so `publish` can compare.
        run: |
          digest="$(bun workflows/scripts/image-staging.mjs layout "$RUNNER_TEMP/image" "$PLATFORM" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA")"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          echo "Built \`$digest\` for $PLATFORM from \`$GITHUB_SHA\`." >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image/
          if-no-files-found: error
          retention-days: 1
          compression-level: 0 # layers are compressed already

  publish:
    name: Push and attest the image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write # push to ghcr.io/unset-sh/staging/<image-name> with the workflow's own token
      id-token: write # sign the attestation
      attestations: write # store the attestation
    outputs:
      digest: ${{ steps.pushed.outputs.digest }}
      image: ${{ steps.pushed.outputs.image }}
    steps:
      # No code of the calling repository is checked out or run in this job.
      - name: An image is pushed only from a push to staging in the organisation
        id: image
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          IMAGE_NAME: ${{ inputs.image-name }}
        # The registry and channel are fixed; only the validated final name may differ from the repository.
        run: |
          if [ "$EVENT" != push ] || [ "$REF" != refs/heads/staging ]; then
            echo "::error::A staging image is pushed only from a push to staging. This run is $EVENT on $REF."
            exit 1
          fi
          if [ "$OWNER" != unset-sh ] || ! [[ "$REPOSITORY" =~ ^unset-sh/[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Expected a repository of unset-sh named in lower-case letters, digits and dashes, got '$REPOSITORY'."
            exit 1
          fi
          if [ -n "$IMAGE_NAME" ] && ! [[ "$IMAGE_NAME" =~ ^[a-z0-9]+(-[a-z0-9]+)*$ ]]; then
            echo "::error::Expected image-name to contain lower-case letters, digits and single dashes, with no leading or trailing dash."
            exit 1
          fi
          image_name="${IMAGE_NAME:-${REPOSITORY#unset-sh/}}"
          echo "repository=ghcr.io/unset-sh/staging/$image_name" >> "$GITHUB_OUTPUT"
      - name: This workflow knows where its own scripts are
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        # If these were empty, the checkout below would fall back to the calling repository and the steps
        # after it would run that repository's files in place of the scripts here.
        run: |
          if [ "$WORKFLOW_REPOSITORY" != unset-sh/tooling ] || ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected to run from unset-sh/tooling at a full commit, got '$WORKFLOW_REPOSITORY' at '$WORKFLOW_SHA'."
            exit 1
          fi
      - name: Check out this workflow's own scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflows
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: workflows/.bun-version
          no-cache: true # never restore a runner from a cache another run wrote
          token: "" # an exact version needs no API call, so the action gets no token
      - name: Bun is the exact version workflows/.bun-version names
        env:
          BUN_VERSION_FILE: workflows/.bun-version
        # setup-bun falls back to the latest release when the file is missing or unreadable; this refuses that.
        run: test "$(bun --version)" = "$(cat "$BUN_VERSION_FILE")"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/image
      - name: The download is the one image that was built
        id: layout
        env:
          PLATFORM: ${{ inputs.platform }}
          BUILT: ${{ needs.build.outputs.digest }}
        # The build job ran the repository's code, so what it wrote is data to check, not to trust.
        run: |
          digest="$(bun workflows/scripts/image-staging.mjs layout "$RUNNER_TEMP/image" "$PLATFORM" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "$GITHUB_SHA")"
          if [ "$digest" != "$BUILT" ]; then
            echo "::error::The downloaded image is $digest, but the build job reported '$BUILT'. Nothing is pushed."
            exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Install crane, checked against the pinned checksum
        env:
          # go-containerregistry v0.22.1 (released 2026-09-03), the SHA-256 its checksums.txt lists for this
          # file, checked against the downloaded file 2026-11-24.
          CRANE_URL: https://github.com/google/go-containerregistry/releases/download/v0.22.1/go-containerregistry_Linux_x86_64.tar.gz
          CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0
        run: |
          mkdir "$RUNNER_TEMP/crane"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --output "$RUNNER_TEMP/crane/crane.tar.gz" "$CRANE_URL"
          echo "$CRANE_SHA256  $RUNNER_TEMP/crane/crane.tar.gz" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/crane/crane.tar.gz" -C "$RUNNER_TEMP/crane" crane
      - name: Sign in to ghcr.io with the workflow's own token
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        # Into ~/.docker/config.json, where crane looks and where actions/attest reads the credentials it pushes
        # the attestation with (its bundled @sigstore/oci getRegistryCredentials, at the pinned commit).
        run: docker login ghcr.io --username "$ACTOR" --password-stdin <<< "$TOKEN"
      - name: Push the image by its digest, with no tag
        id: pushed
        env:
          REPOSITORY: ${{ steps.image.outputs.repository }}
          DIGEST: ${{ steps.layout.outputs.digest }}
        # crane pushes a layout folder holding one image as that image, and a reference by digest writes the
        # manifest under its digest only (go-containerregistry v0.22.1 cmd/crane/cmd/push.go and
        # pkg/v1/remote/write.go). The manifest is then read back and hashed, so a registry that stored other
        # bytes stops the run before anything is attested.
        run: |
          crane="$RUNNER_TEMP/crane/crane"
          "$crane" push "$RUNNER_TEMP/image" "$REPOSITORY@$DIGEST" --image-refs "$RUNNER_TEMP/pushed.txt"
          pushed="$(cat "$RUNNER_TEMP/pushed.txt")"
          if [ "$pushed" != "$REPOSITORY@$DIGEST" ]; then
            echo "::error::crane reports '$pushed', not $REPOSITORY@$DIGEST."
            exit 1
          fi
          "$crane" manifest "$REPOSITORY@$DIGEST" > "$RUNNER_TEMP/manifest.json"
          stored="sha256:$(sha256sum "$RUNNER_TEMP/manifest.json" | cut -d ' ' -f 1)"
          if [ "$stored" != "$DIGEST" ]; then
            echo "::error::The registry holds $stored for $REPOSITORY@$DIGEST."
            exit 1
          fi
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "image=$REPOSITORY@$DIGEST" >> "$GITHUB_OUTPUT"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.repository }}
          subject-digest: ${{ steps.pushed.outputs.digest }}
          push-to-registry: true
          # A storage record needs artifact-metadata: write, which the approved permissions do not include; the
          # action only warns without it (src/attest.ts at the pinned commit), so it is not asked for.
          create-storage-record: false
      - name: Sign out of ghcr.io
        if: always()
        run: docker logout ghcr.io
      - name: Say how to check the image
        env:
          IMAGE: ${{ steps.pushed.outputs.image }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          {
            echo "## Pushed \`$IMAGE\`"
            echo
            echo "From \`$GITHUB_REPOSITORY\` at \`$GITHUB_SHA\` on staging. To check it came through this workflow:"
            echo
            echo '```sh'
            echo "gh attestation verify oci://$IMAGE \\"
            echo "  --repo $GITHUB_REPOSITORY \\"
            echo "  --signer-workflow unset-sh/tooling/.github/workflows/image-staging.yml \\"
            echo "  --signer-digest $WORKFLOW_SHA \\"
            echo "  --source-ref refs/heads/staging \\"
            echo "  --source-digest $GITHUB_SHA \\"
            echo "  --deny-self-hosted-runners"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
