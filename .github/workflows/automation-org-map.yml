# Generated by scripts/workflows.mjs from workflows/github/docs/map.yml to .github/workflows/automation-org-map.yml; do not edit.
name: org-map-publication

on:
  workflow_call:

permissions: {}

jobs:
  generate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Validate source and helper identities
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ "$REPOSITORY" != unset-sh/.github ] || [ "$REF" != refs/heads/main ] || [ "$WORKFLOW_REPOSITORY" != unset-sh/tooling ] || ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected the organisation map on main and pinned tooling."
            exit 1
          fi
          case "$EVENT" in push|schedule|workflow_dispatch) ;; *) exit 1 ;; esac
      - name: Check out the exact map source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          path: source
          persist-credentials: false
      - name: Check out the pinned publication helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tooling/.nvmrc
          package-manager-cache: false
      - name: Regenerate and check the map
        working-directory: source
        run: |
          npm run map
          npm run check
      - name: Stage only the two generated Markdown views
        env:
          SOURCE_COMMIT: ${{ github.sha }}
        run: node tooling/scripts/generated-map-publication.mjs stage --root "$GITHUB_WORKSPACE/source" --out "$RUNNER_TEMP/map.json" --commit "$SOURCE_COMMIT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: org-map-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/map.json
          if-no-files-found: error
          retention-days: 7

  publish:
    outputs:
      number: ${{ steps.publication.outputs.number }}
      head: ${{ steps.publication.outputs.head }}
      base: ${{ steps.publication.outputs.base }}
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Validate source and helper identities
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ "$REPOSITORY" != unset-sh/.github ] || [ "$REF" != refs/heads/main ] || [ "$WORKFLOW_REPOSITORY" != unset-sh/tooling ] || ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected the organisation map on main and pinned tooling."
            exit 1
          fi
          case "$EVENT" in push|schedule|workflow_dispatch) ;; *) exit 1 ;; esac
      - name: Check out only the trusted publication helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tooling/.nvmrc
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: org-map-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/org-map
      - name: Prepare a validated generated-only main PR
        id: publication
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tooling/scripts/generated-map-publication.mjs publish --snapshot "$RUNNER_TEMP/org-map/map.json"


  dispatch:
    needs: publish
    if: needs.publish.outputs.number != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: write
    steps:
      - name: Validate source and helper identities
        env:
          REPOSITORY: ${{ github.repository }}
          REF: ${{ github.ref }}
          EVENT: ${{ github.event_name }}
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        run: |
          if [ "$REPOSITORY" != unset-sh/.github ] || [ "$REF" != refs/heads/main ] || [ "$WORKFLOW_REPOSITORY" != unset-sh/tooling ] || ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected the organisation map on main and pinned tooling."
            exit 1
          fi
          case "$EVENT" in push|schedule|workflow_dispatch) ;; *) exit 1 ;; esac
      - name: Check out only the trusted dispatch helper
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: tooling
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: tooling/.nvmrc
          package-manager-cache: false
      - name: Revalidate the generated PR and request its existing checks
        env:
          GH_TOKEN: ${{ github.token }}
          MAP_PR_NUMBER: ${{ needs.publish.outputs.number }}
          MAP_PR_HEAD: ${{ needs.publish.outputs.head }}
          MAP_PR_BASE: ${{ needs.publish.outputs.base }}
        run: node tooling/scripts/generated-map-checks.mjs
