# Generated by scripts/workflows.mjs from workflows/shared/releases/package.yml to .github/workflows/releases-package.yml; do not edit.
name: release

# The release every unset.sh repository runs, called from that repository's own release workflow:
#
#   on:
#     push:
#       branches: [main]
#       paths: [package.json]
#   permissions: {}
#   concurrency:
#     group: release
#     cancel-in-progress: false
#   jobs:
#     release:
#       uses: unset-sh/tooling/.github/workflows/releases-package.yml@<full commit> # v<version>
#       permissions:
#         contents: write
#         packages: write
#         id-token: write
#         attestations: write
#         actions: read
#
# A release starts when a raised version in package.json lands on main. There is no tag to push and no button
# to press. `plan` checks that the `release` environment is still the owner's, `build` runs the repository's
# check and builds once, and `publish` waits. The owner's one step is Approve. `publish` then checks what was
# built, attests it, publishes it, and creates the tag v<version> at that commit. README.md describes the
# inputs and what a repository needs before its first release. Public repositories only: the tag lookup
# carries no credentials, and on the organisation's plan attestations and required reviewers exist only there.
#
# Why from main and not from a pushed tag: GitHub runs the workflow file of the commit a run starts from, so a
# tag on an unreviewed commit would bring its own release workflow. A push to main runs only reviewed code
# ("Runs your workflow when you push a commit or tag",
# https://docs.github.com/en/actions/reference/workflows-and-actions/events-that-trigger-workflows#push), and a
# tag created with the workflow's own token starts no new run
# (https://docs.github.com/en/actions/concepts/security/github_token). Both read 2026-11-22.
#
# Why here and not in each repository: an attestation names the workflow file that signed it, and for a job in
# a reusable workflow that is this file, not the caller
# (https://docs.github.com/en/actions/how-tos/secure-your-work/use-artifact-attestations/increase-security-rating,
# read 2026-11-22). A branch of the calling repository cannot edit this file, so a release that verifies
# against it, from the caller's main, came through the approval below.
#
# What runs where:
#   - `plan` and `build` hold a read-only token. `build` is the only job that runs the calling repository's
#     code and the commands it passes in.
#   - `publish` is the only job that can write, the only one that names the environment, and runs no code
#     from the calling repository: only this repository's scripts, pinned actions, npm and gh. What `build`
#     hands it is data it checks before use: plain file names, and a packed package whose package.json is
#     read here again, because npm takes settings from it (scripts/release-package.mjs).
#   - The scripts come from this repository at the commit this workflow file runs from
#     (`job.workflow_repository` and `job.workflow_sha`,
#     https://docs.github.com/en/actions/reference/workflows-and-actions/contexts#job-context, read 2026-11-22).

on:
  workflow_call:
    inputs:
      install:
        description: Run `npm ci --ignore-scripts` before the check. Leave off for a repository with no dependencies.
        type: boolean
        default: false
      check:
        description: The command that must pass before anything is built.
        type: string
        default: npm run check
      build:
        description: A command, run after the check, that writes the files for the release page into the folder `files` names.
        type: string
        default: ""
      files:
        description: A folder of the repository. Every file directly in it is attested and attached to the release page.
        type: string
        default: ""
      npm-package:
        description: Also pack the repository as an npm package, attest it, and publish it to GitHub Packages.
        type: boolean
        default: false
    outputs:
      version:
        description: The version in package.json.
        value: ${{ jobs.plan.outputs.version }}
      released:
        description: "'true' when this run published that version."
        value: ${{ jobs.publish.outputs.released }}

permissions: {}

defaults:
  run:
    shell: bash # with -o pipefail, so a failed command before a pipe fails the step

jobs:
  plan:
    name: Decide whether this version is new, and check the release environment
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read # read the environment and its branch policies
    outputs:
      version: ${{ steps.version.outputs.version }}
      publish: ${{ steps.version.outputs.publish }}
      name: ${{ steps.package.outputs.name }}
    steps:
      - name: A release starts only from a push to main
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$EVENT" != push ] || [ "$REF" != refs/heads/main ]; then
            echo "::error::A release starts only from a push to main. This run is $EVENT on $REF."
            exit 1
          fi
      - name: This workflow knows where its own scripts are
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        # If these were empty, the checkout below would fall back to the calling repository and the steps
        # after it would run that repository's files in place of the scripts here.
        run: |
          if [ "$WORKFLOW_REPOSITORY" != unset-sh/tooling ] || ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected to run from unset-sh/tooling at a full commit, got '$WORKFLOW_REPOSITORY' at '$WORKFLOW_SHA'."
            exit 1
          fi
      - name: Check out the repository being released
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repository
          persist-credentials: false
      - name: Check out this workflow's own scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflows
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: workflows/.nvmrc
          package-manager-cache: false
      - name: Read the version, and stop quietly if it is already released
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BEFORE: ${{ github.event.before }}
        run: |
          version="$(node workflows/scripts/release-manifest.mjs repository/package.json)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$version" = "0.0.0" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Version 0.0.0: nothing is released yet." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # The pattern also matches a longer name that ends the same way (x/refs/tags/v1.2.3), so the names
          # that come back are compared whole (git v2.43.0 Documentation/git-ls-remote.txt, "<patterns>").
          if ! refs="$(git ls-remote --tags "$GITHUB_SERVER_URL/$GH_REPO" "refs/tags/v$version")"; then
            echo "::error::Could not list the tags."
            exit 1
          fi
          tagged=false
          while IFS=$'\t' read -r _ ref; do
            if [ "$ref" = "refs/tags/v$version" ]; then tagged=true; fi
          done <<< "$refs"
          if [ "$tagged" = false ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A tag with no release page was pushed by hand, not made here: stop loudly, never skip it.
          if ! gh release view "v$version" > /dev/null; then
            echo "::error::v$version is tagged but has no release; a v* tag is never pushed by hand. Ask the owner."
            exit 1
          fi
          # Every change to package.json starts a run, so an already released version is normally nothing to
          # do. It is something when this push is the one that raised the version: the release this run was
          # meant to make exists already, so it was made some other way and never waited for the approval.
          previous=""
          if [[ "$BEFORE" =~ ^[0-9a-f]{40}$ ]] \
            && git -C repository fetch --quiet --depth 1 "$GITHUB_SERVER_URL/$GH_REPO" "$BEFORE" \
            && git -C repository show "$BEFORE:package.json" > "$RUNNER_TEMP/before.json"; then
            previous="$(node workflows/scripts/release-manifest.mjs "$RUNNER_TEMP/before.json" || true)"
          fi
          if [ "$previous" != "$version" ]; then
            echo "::error::The version before this push ('${previous:-not readable}') is not $version, but v$version is already tagged and released, so this run did not release it. If this run repeats one that did, there is nothing to do; otherwise tell the owner."
            exit 1
          fi
          echo "publish=false" >> "$GITHUB_OUTPUT"
          echo "v$version is already released; nothing to do." >> "$GITHUB_STEP_SUMMARY"
      - name: The release environment holds the owner's approval, from main only
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh api "repos/$GH_REPO/environments/release" > "$RUNNER_TEMP/environment.json"
          # This listing fails when the environment allows any branch; the gate then names that problem.
          gh api "repos/$GH_REPO/environments/release/deployment-branch-policies" > "$RUNNER_TEMP/policies.json" \
            || echo '{}' > "$RUNNER_TEMP/policies.json"
          node workflows/scripts/release-gate.mjs "$RUNNER_TEMP/environment.json" "$RUNNER_TEMP/policies.json"
      - name: The package may be published as it is
        id: package
        if: steps.version.outputs.publish == 'true' && inputs.npm-package
        # On its own line: a command that fails inside an `echo "$(...)"` would not fail the step.
        run: |
          name="$(node workflows/scripts/release-manifest.mjs repository/package.json --npm-package --name)"
          echo "name=$name" >> "$GITHUB_OUTPUT"
      - name: The changelog says what this version changes
        if: steps.version.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node workflows/scripts/release-notes.mjs repository/CHANGELOG.md "$VERSION" > /dev/null

  build:
    name: Check and build what will be published
    needs: plan
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: This workflow knows where its own scripts are
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        # If these were empty, the checkout below would fall back to the calling repository and the steps
        # after it would run that repository's files in place of the scripts here.
        run: |
          if [ "$WORKFLOW_REPOSITORY" != unset-sh/tooling ] || ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected to run from unset-sh/tooling at a full commit, got '$WORKFLOW_REPOSITORY' at '$WORKFLOW_SHA'."
            exit 1
          fi
      - name: Check out the repository being released
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: repository
          persist-credentials: false
      - name: Check out this workflow's own scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflows
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: repository/.nvmrc
          package-manager-cache: false
      - name: Install dependencies, running none of their scripts
        if: inputs.install
        working-directory: repository
        run: npm ci --ignore-scripts
      - name: Check
        working-directory: repository
        env:
          COMMAND: ${{ inputs.check }}
        run: bash -eo pipefail -c "$COMMAND"
      - name: Build the release files
        if: inputs.build != ''
        working-directory: repository
        env:
          COMMAND: ${{ inputs.build }}
        run: bash -eo pipefail -c "$COMMAND"
      - name: Pack the npm package
        if: inputs.npm-package
        working-directory: repository
        env:
          NAME: ${{ needs.plan.outputs.name }}
          VERSION: ${{ needs.plan.outputs.version }}
        # `publish` makes the same check on what it downloads, and that one counts: this job runs the
        # repository's code. It is made here too so a package that would be refused stops before the approval.
        run: |
          mkdir -p "$RUNNER_TEMP/release/files"
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/release/files"
          node ../workflows/scripts/release-package.mjs "$RUNNER_TEMP/release/files"/*.tgz "$NAME" "$VERSION"
      - name: Gather the release files
        if: inputs.files != ''
        env:
          FILES: ${{ inputs.files }}
        run: node workflows/scripts/release-files.mjs collect repository "$FILES" "$RUNNER_TEMP/release/files"
      - name: Write the release notes, and show what waits for approval
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          out="$RUNNER_TEMP/release"
          mkdir -p "$out/files"
          node workflows/scripts/release-notes.mjs repository/CHANGELOG.md "$VERSION" > "$out/notes.md"
          node workflows/scripts/release-files.mjs list "$out/files" > "$RUNNER_TEMP/names.txt"
          last="$(gh release list --limit 1 --exclude-drafts --json tagName --jq '.[0].tagName // ""')"
          if [ -z "$last" ]; then
            changes="the first release: all of main up to this commit"
          else
            changes="$GITHUB_SERVER_URL/$GH_REPO/compare/$last...$GITHUB_SHA"
          fi
          {
            echo "## v$VERSION waits for approval"
            echo
            echo "Commit \`$GITHUB_SHA\` on main. Changes since the last release: $changes"
            echo
            if [ -s "$RUNNER_TEMP/names.txt" ]; then
              echo '```'
              (cd "$out/files" && xargs -d '\n' sha256sum < "$RUNNER_TEMP/names.txt")
              echo '```'
            else
              echo "No files are attached: this release is the tag and its release page."
            fi
            echo
            cat "$out/notes.md"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ runner.temp }}/release/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish the release
    needs: [plan, build]
    # A job whose needs failed or were skipped is skipped too, and stays so with this condition: "A default
    # status check of success() is applied unless you include one of these functions" (github/docs
    # content/actions/reference/workflows-and-actions/expressions.md, read 2026-11-22). Said here as well as
    # implied, so a later edit cannot loosen it unnoticed.
    if: needs.plan.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write # create the tag and the release page with the workflow's own token; no stored secret
      packages: write # publish an npm package to GitHub Packages with the same token
      id-token: write # sign the attestation
      attestations: write # store the attestation
      actions: read # read the environment and its branch policies again
    outputs:
      released: ${{ steps.published.outputs.released }}
    steps:
      # No code of the calling repository is checked out or run in this job.
      - name: This workflow knows where its own scripts are
        env:
          WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          WORKFLOW_SHA: ${{ job.workflow_sha }}
        # If these were empty, the checkout below would fall back to the calling repository and the steps
        # after it would run that repository's files in place of the scripts here.
        run: |
          if [ "$WORKFLOW_REPOSITORY" != unset-sh/tooling ] || ! [[ "$WORKFLOW_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Expected to run from unset-sh/tooling at a full commit, got '$WORKFLOW_REPOSITORY' at '$WORKFLOW_SHA'."
            exit 1
          fi
      - name: Check out this workflow's own scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: workflows
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: workflows/.nvmrc
          package-manager-cache: false
          registry-url: https://npm.pkg.github.com
          scope: "@unset-sh"
      - name: The release environment is still the owner's
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        # `plan` read it before the wait, which can last days, and "Re-run failed jobs" starts this job
        # without `plan`. The approval that let this job start is only worth what the environment requires now.
        run: |
          gh api "repos/$GH_REPO/environments/release" > "$RUNNER_TEMP/environment.json"
          gh api "repos/$GH_REPO/environments/release/deployment-branch-policies" > "$RUNNER_TEMP/policies.json" \
            || echo '{}' > "$RUNNER_TEMP/policies.json"
          node workflows/scripts/release-gate.mjs "$RUNNER_TEMP/environment.json" "$RUNNER_TEMP/policies.json"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release
          path: release
      - name: Exactly what was built
        id: files
        env:
          NPM_PACKAGE: ${{ inputs.npm-package }}
        run: |
          mkdir -p release/files
          test "$(ls -A release | sort | tr '\n' ' ')" = "files notes.md "
          test -f release/notes.md
          test ! -L release/notes.md
          node workflows/scripts/release-files.mjs list release/files > "$RUNNER_TEMP/names.txt"
          packages="$(grep -c '\.tgz$' "$RUNNER_TEMP/names.txt" || true)"
          if [ "$NPM_PACKAGE" = true ] && [ "$packages" -ne 1 ]; then
            echo "::error::Expected exactly one packed package, found $packages."
            exit 1
          fi
          echo "count=$(wc -l < "$RUNNER_TEMP/names.txt")" >> "$GITHUB_OUTPUT"
      - name: The packed package is the one main describes
        if: inputs.npm-package
        env:
          NAME: ${{ needs.plan.outputs.name }}
          VERSION: ${{ needs.plan.outputs.version }}
        # npm reads "publishConfig" in the package it publishes as its own settings, a proxy included, and
        # this file was packed by the job that runs the repository's code. Nothing is attested or published
        # unless its package.json is the one `plan` read on main, with the registry as its only setting.
        run: |
          package="$(grep '\.tgz$' "$RUNNER_TEMP/names.txt")"
          node workflows/scripts/release-package.mjs "release/files/$package" "$NAME" "$VERSION"
          echo "$package" > "$RUNNER_TEMP/package.txt"
      - name: The tag does not exist yet
        env:
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          # gh would reuse a tag that appeared meanwhile, wherever it points, so refuse one instead. A failed
          # lookup stops the release too. The names that come back are compared whole, as in `plan`.
          if ! refs="$(git ls-remote --tags "$GITHUB_SERVER_URL/$GH_REPO" "refs/tags/v$VERSION")"; then
            echo "::error::Could not list the tags; nothing is published."
            exit 1
          fi
          while IFS=$'\t' read -r _ ref; do
            if [ "$ref" = "refs/tags/v$VERSION" ]; then
              echo "::error::v$VERSION was tagged while this run waited; nothing is published. Raise the version again."
              exit 1
            fi
          done <<< "$refs"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: steps.files.outputs.count != '0'
        with:
          subject-path: release/files/*
      - name: Publish the package to GitHub Packages
        if: inputs.npm-package
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        # npm runs in a new folder that holds the checked package and nothing else, so no other release file
        # can pass for a package.json or a settings file of the folder npm starts in. A bare `a/b.tgz` reads
        # to npm as a GitHub repository, so the path starts with "./" (npm 11.20.0, seen on unset-sh/brand
        # v0.1.0).
        #
        # npm also starts with an environment of four names and no more: where to find node, where to keep
        # its cache, the settings file actions/setup-node wrote (src/authutil.ts at the pinned commit exports
        # NPM_CONFIG_USERCONFIG; the file names the registry and reads the token from NODE_AUTH_TOKEN), and
        # the token. The rest of the job's environment stays out of its reach, the two ACTIONS_ID_TOKEN_REQUEST
        # values included, with which npm would ask for an identity token as this job (npm 11.20.0
        # lib/utils/oidc.js).
        run: |
          if [ -z "${NPM_CONFIG_USERCONFIG:-}" ] || [ ! -f "$NPM_CONFIG_USERCONFIG" ]; then
            echo "::error::actions/setup-node left no npm settings file; nothing is published."
            exit 1
          fi
          package="$(cat "$RUNNER_TEMP/package.txt")"
          folder="$(mktemp -d)"
          cp "release/files/$package" "$folder/"
          cd "$folder"
          env -i PATH="$PATH" HOME="$HOME" NPM_CONFIG_USERCONFIG="$NPM_CONFIG_USERCONFIG" NODE_AUTH_TOKEN="$NODE_AUTH_TOKEN" \
            npm publish --ignore-scripts "./$package"
      - name: Create the tag at this commit and publish the release page
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
        # "If a matching git tag does not yet exist, one will automatically get created", at --target; with
        # assets, gh creates a draft, uploads, then publishes (https://cli.github.com/manual/gh_release_create,
        # read 2026-11-22).
        run: |
          assets=()
          while IFS= read -r name; do assets+=("release/files/$name"); done < "$RUNNER_TEMP/names.txt"
          gh release create "v$VERSION" "${assets[@]}" \
            --target "$GITHUB_SHA" --title "v$VERSION" --notes-file release/notes.md
      - name: The published tag points at this commit
        id: published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.plan.outputs.version }}
          COUNT: ${{ steps.files.outputs.count }}
        run: |
          # A tag pushed in the seconds between the check above and the create would be reused by gh. The release
          # cannot be taken back once published, but the run fails loudly so the owner knows not to announce it.
          # Asked for as a tag: a branch can carry the same name ("tag name (tags/TAG_NAME)", REST API
          # description 1.1.4, GET /repos/{owner}/{repo}/commits/{ref}).
          tagged="$(gh api "repos/$GH_REPO/commits/tags/v$VERSION" --jq .sha)"
          if [ "$tagged" != "$GITHUB_SHA" ]; then
            echo "::error::v$VERSION points at $tagged, not $GITHUB_SHA. Do not use this release; tell the owner."
            exit 1
          fi
          echo "released=true" >> "$GITHUB_OUTPUT"
          {
            echo "## v$VERSION is published"
            echo
            echo "$GITHUB_SERVER_URL/$GH_REPO/releases/tag/v$VERSION, at commit \`$GITHUB_SHA\`."
            if [ "$COUNT" != 0 ]; then
              echo
              echo "To check that a downloaded file came through this approval:"
              echo
              echo '```sh'
              echo "gh attestation verify <file> --repo $GH_REPO \\"
              echo "  --signer-workflow unset-sh/tooling/.github/workflows/releases-package.yml \\"
              echo "  --source-ref refs/heads/main"
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
